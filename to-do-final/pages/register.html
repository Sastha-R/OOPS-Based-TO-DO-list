<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Daily Track</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="auth-page">
    <nav class="navbar navbar-expand-lg app-navbar">
        <div class="container">
            <a class="navbar-brand app-brand" href="index.html">DAILY TRACK</a>
            <div class="d-flex align-items-center gap-2">
                <button type="button" class="btn theme-toggle" id="themeToggle" title="Switch theme">Dark</button>
                <a href="login.html" class="btn btn-outline-primary btn-sm">Login</a>
            </div>
        </div>
    </nav>

    <main class="container auth-wrapper">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card simple-card auth-card">
                    <div class="card-body">
                        <h3 class="text-center mb-1">Create Account</h3>
                        <p class="text-center text-muted mb-4">Register once and start tracking your daily work.</p>
                        <div id="messageBox"></div>

                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" id="username" class="form-control">
                                <small class="text-danger error" id="usernameError"></small>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" id="email" class="form-control">
                                <small class="text-danger error" id="emailError"></small>
                            </div>

                            <div class="mb-3">
                                <label for="phone" class="form-label">Phone Number</label>
                                <input type="number" id="phone" name="phone" class="form-control">
                                <small class="text-danger error" id="phoneError"></small>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" id="password" class="form-control">
                                    <small class="text-danger error" id="passwordError"></small>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                                    <input type="password" id="confirmPassword" class="form-control">
                                    <small class="text-danger error" id="confirmPasswordError"></small>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="dob" class="form-label">Date of Birth</label>
                                <input type="date" id="dob" class="form-control">
                                <small class="text-danger error" id="dobError"></small>
                            </div>

                            <div class="mb-3">
                                <label class="form-label d-block">Gender</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" value="Male" id="male">
                                    <label class="form-check-label" for="male">Male</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" value="Female" id="female">
                                    <label class="form-check-label" for="female">Female</label>
                                </div>
                                <small class="text-danger error d-block" id="genderError"></small>
                            </div>

                            <div class="mb-3">
                                <label class="form-label d-block">Interests</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="interests" value="Music" id="interestMusic">
                                    <label class="form-check-label" for="interestMusic">Music</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="interests" value="Sports" id="interestSports">
                                    <label class="form-check-label" for="interestSports">Sports</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="interests" value="Watching Movies" id="interestMovies">
                                    <label class="form-check-label" for="interestMovies">Watching Movies</label>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="role" class="form-label">Role</label>
                                <select id="role" class="form-select">
                                    <option value="">Select Role</option>
                                    <option value="Student">Student</option>
                                    <option value="Employee">Employee</option>
                                    <option value="Teacher">Teacher</option>
                                    <option value="Other">Other</option>
                                </select>
                                <small class="text-danger error" id="roleError"></small>
                            </div>

                            <div class="mb-3">
                                <label for="address" class="form-label">Address</label>
                                <textarea id="address" class="form-control" rows="3"></textarea>
                                <small class="text-danger error" id="addressError"></small>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-person-plus me-1"></i>Register
                            </button>
                        </form>

                        <p class="text-center mt-3 mb-0">
                            Already have an account? <a href="login.html">Login here</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script type="module" src="../assets/js/register_module.js"></script
    <script src="../assets/js/theme.js"></script>
    <script type="module" src="../assets/js/register.js"></script>
</body>
</html>
