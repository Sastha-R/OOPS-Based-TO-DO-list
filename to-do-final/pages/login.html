<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Daily Track</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="auth-page">
    <nav class="navbar navbar-expand-lg app-navbar">
        <div class="container">
            <a class="navbar-brand app-brand" href="index.html">DAILY TRACK</a>
            <div class="d-flex align-items-center gap-2">
                <button type="button" class="btn theme-toggle" id="themeToggle" title="Switch theme">Dark</button>
                <a href="register.html" class="btn btn-primary btn-sm">Register</a>
            </div>
        </div>
    </nav>

    <main class="container auth-wrapper">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card simple-card auth-card">
                    <div class="card-body">
                        <h3 class="text-center mb-1">Login</h3>
                        <p class="text-center text-muted mb-4">Welcome back to your task dashboard.</p>
                        <div id="loginMessage"></div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" id="email" class="form-control">
                                <small class="text-danger error" id="emailError"></small>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" id="password" class="form-control">
                                <small class="text-danger error" id="passwordError"></small>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Login
                            </button>
                        </form>

                        <p class="text-center mt-3 mb-0">
                            New user? <a href="register.html">Register here</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="position-fixed top-0 end-0 p-3" style="z-index: 1080;">
      <div id="loginToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body">Registration successful. Please login.</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script type="module" src="../assets/js/login.js"></script>
</body>
</html>
