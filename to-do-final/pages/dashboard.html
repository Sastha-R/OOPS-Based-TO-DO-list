<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Daily Track</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="dashboard-page">
    <nav class="navbar navbar-expand-lg app-navbar">
        <div class="container">
            <a class="navbar-brand app-brand" href="index.html">DAILY TRACK</a>
            <div class="d-flex align-items-center gap-2">
                <button type="button" class="btn theme-toggle" id="themeToggle" title="Switch theme">Dark</button>
                <div class="dropdown">
                    <button class="btn btn-outline-secondary btn-sm dropdown-toggle user-menu-btn" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>
                        <span id="navUserName"></span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><button class="dropdown-item text-danger" type="button" id="logoutBtn">Logout</button></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <main class="container dashboard-wrapper">
        <section class="dashboard-header d-flex flex-wrap justify-content-between align-items-center mb-4">
            <div>
                <h3 class="mb-1">Dashboard</h3>
                <p class="text-muted mb-0">Welcome, <span id="userName"></span></p>
            </div>
            <button type="button" class="btn btn-primary btn-sm" id="addTaskBtn">
                <i class="bi bi-plus-lg me-1"></i>Add Task
            </button>
        </section>

        <div class="card simple-card mb-4 collapse" id="taskFormCard">
            <div class="card-body">
                <h5 id="formTitle">Add Task</h5>
                <form id="taskForm">
                    <input type="hidden" id="editId">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" id="title" class="form-control" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="dueDate" class="form-label">Due Date</label>
                            <input type="date" id="dueDate" class="form-control" lang="en-GB" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="status" class="form-label">Task Status</label>
                            <select id="status" class="form-select" required>
                                <option value="Not Started">Not Started</option>
                                <option value="Pending">Pending</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea id="description" class="form-control" rows="3" required></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <button type="submit" class="btn btn-primary icon-action-btn" id="saveBtn" title="Add task">
                          save task
                        </button>
                        <button type="button" class="btn btn-secondary" id="cancelBtn"> <i class="bi bi-x-circle"></i></button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card simple-card">
            <div class="card-body">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                    <div>
                        <h5 class="mb-1">Tasks</h5>
                        <div id="filterTitle" class="small text-muted">All Tasks</div>
                    </div>
                    <div class="task-filters">
                        <button class="btn btn-outline-primary btn-sm filter-btn" data-filter="All">All Tasks</button>
                        <button class="btn btn-outline-warning btn-sm filter-btn" data-filter="Pending">Pending</button>
                        <button class="btn btn-outline-secondary btn-sm filter-btn" data-filter="Not Started">Not Started</button>
                        <button class="btn btn-outline-success btn-sm filter-btn" data-filter="Completed">Completed</button>
                        <button class="btn btn-outline-info btn-sm filter-btn" data-filter="Due Date">Due Date</button>
                        <button class="btn btn-outline-danger btn-sm filter-btn" data-filter="Overdue">Over Due Tasks</button>
                        <button class="btn btn-outline-dark btn-sm filter-btn" data-filter="Deleted">Deleted Tasks</button>
                        <button type="button" class="btn btn-outline-info btn-sm" id="dateRangeBtn">From Date - To Date</button>
                        <span id="dateRangeFields" class="d-none mt-2">
                            <label for="fromDateFilter" class="form-label small mb-0">From Date</label>
                            <input type="date" id="fromDateFilter" class="form-control form-control-sm d-inline-block w-auto" lang="en-GB" title="From Date">
                            <label for="toDateFilter" class="form-label small mb-0">To Date</label>
                            <input type="date" id="toDateFilter" class="form-control form-control-sm d-inline-block w-auto" lang="en-GB" title="To Date">
                        </span>
                    </div>
                </div>

                <div class="table-responsive task-table-wrap">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Description</th>
                                <th>Created Date</th>
                                <th>Due Date</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="taskList"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div class="position-fixed top-0 end-0 p-3" style="z-index: 1080;">
      <div id="dashboardToast" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src = "/to-do-final/assets/js/task_Module.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/dashboard.js"></script>
</body>
</html>
